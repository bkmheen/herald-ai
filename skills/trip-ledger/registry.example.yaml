# registry.example.yaml — 구조 예시 (실제 값 없음)
#
# ⛔ herald-ai 는 공개 저장소다. 시트 ID·컬렉션 ID 등 실제 식별자를 여기에 커밋하지 마라.
#    실제 파일은 볼트에 둔다:
#      $VAULT_ROOT/Dossier/Registry/RG_여행지출/<프로젝트키>.yaml
#      ($VAULT_ROOT 는 ~/.herald/vault.conf 에서 설정한다)
#    볼트는 서버 맥에서만 쓸 수 있다 (SKILL.md 0단계·§5).

project_key: YYMM00-여행명-도시        # 파일명과 동일하게

trip:
  title: 2026 여름휴가 네덜란드            # 사람이 읽는 이름
  kind: 개인 | 출장                        # AN_개인 / AN_법인·AN_연구 배정과 연동
  period: { from: YYYY-MM-DD, to: YYYY-MM-DD }
  travelers: [이름, 이름]
  currency: EUR                            # 현지 통화 — 시트 H열 환산쌍(EURKRW) 결정

vault:
  anthology_uid: UID_XXXXXXXXXX            # 앤솔로지(링크그룹) 노트 UID
  anthology_path: Dossier/Anthologies/YYMM00 <여행명> 비용기록.md
  area: AR_시스템-지출원장                  # 앤솔로지 frontmatter 의 areas 와 동일 (SKILL.md §1)

sheets:
  workbook_id: <스프레드시트 ID>
  tabs:
    요약:     { gid: <gid> }
    영수증:   { gid: <gid> }
    기타결제: { gid: <gid> }
  categories: [식비, 관람, 기념품, 쇼핑]   # F열 분류 — 프로젝트 시작 시 고정
  fx_pair: EURKRW                          # GOOGLEFINANCE 통화쌍

maps:
  list_name: <구글맵 목록명>               # 시트 M열 값과 글자까지 동일해야 한다
  list_url: https://www.google.com/interests/saved/list/<컬렉션 id>
  registered_count: 0                      # 목록에 올라간 핀 수
  memo_written: 0                          # 그 중 메모까지 기입된 수
  memo_pending: 0                          # 아래 pending_memos 건수

  # 핀 메모 대기열 — 지도 작업을 재개하면 여기부터 소진한다.
  # 메모가 있어야 지도 → 노트 역참조가 성립한다(노트의 [MAPS_REGISTERED] 마커와 쌍).
  # memo 는 **그대로 붙여넣을 완성 문안**으로 적는다. 나중에 다시 조사하지 않기 위해서다.
  # 완료분은 지우고 memo_written / memo_pending 을 갱신한다.
  pending_memos:
    - place: <핀 이름 — 지도 표기 그대로>
      disambiguate: <같은 이름 핀이 여럿일 때 어느 것인지>   # 필요할 때만
      status: blank | incomplete           # blank=공란 / incomplete=방문 일부 누락
      reason: <incomplete 인 경우 무엇이 빠졌는지>            # 필요할 때만
      memo: "YYYY-MM-DD(요일) HH:MM · <통화><금액> · <내역> [UID_...]"

  # 등록 자체가 불가·비대상인 건 — 대기열과 구분해 둔다 (다음 작업의 재시도 방지)
  not_registrable:
    - uid: UID_XXXXXXXXXX
      item: <노트 제목>
      reason: <예: 영수증에 상호·주소 없음 — 장소 특정 불가 (L-007)>

status:
  last_synced: YYYY-MM-DD
  open_items:                              # 미해결 항목 — 다음 작업의 출발점
    - <예: 출국편 승급 경위 기록 없음 — 확인 필요>
